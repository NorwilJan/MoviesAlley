<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamVault — Cinema & Movies</title>
  <style>
    /* =========================================================
       THEATER DARK THEME STYLES
    ========================================================= */
    :root {
      --bg-dark: #0f0f11;
      --card-bg: #18181c;
      --accent-red: #e50914;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #2a2a30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Navigation */
    header {
      background: rgba(15, 15, 17, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-red);
      letter-spacing: 1px;
    }

    .search-box {
      width: 320px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      font-size: 0.9rem;
    }

    .search-box input:focus {
      border-color: var(--accent-red);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      padding: 32px 16px;
    }

    .section-title {
      font-size: 1.25rem;
      margin-bottom: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Grid Displays */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    /* Movie Card */
    .movie-card {
      position: relative;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .movie-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .movie-card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
    }

    .bookmark-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: none;
      font-size: 1.1rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .bookmark-btn:hover {
      background: rgba(0, 0, 0, 0.95);
    }

    .movie-info {
      padding: 10px;
    }

    .movie-info h4 {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-info span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Skeleton Loader Animation */
    .skeleton-card {
      background: var(--card-bg);
      border-radius: 8px;
      aspect-ratio: 2/3;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 0.8; }
      100% { opacity: 0.4; }
    }

    /* Modal Layer */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 900px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 10;
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
    }

    .server-picker {
      display: flex;
      gap: 10px;
      margin: 12px 0 20px 0;
    }

    .server-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .server-btn.active {
      background: var(--accent-red);
      border-color: var(--accent-red);
    }

    .movie-details p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">STREAMVAULT</div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search movies...">
    </div>
  </header>

  <!-- Main View -->
  <main>
    <!-- Search Results View (Hidden when empty) -->
    <div id="search-section" style="display: none;">
      <h2 class="section-title">Search Results</h2>
      <div id="search-results-grid" class="grid"></div>
    </div>

    <!-- LocalStorage Watchlist View -->
    <div id="watchlist-section" style="display: none;">
      <h2 class="section-title">My Watchlist</h2>
      <div id="watchlist-grid" class="grid"></div>
    </div>

    <!-- Main Feed -->
    <h2 class="section-title">Trending Movies</h2>
    <div id="main-movie-grid" class="grid"></div>
  </main>

  <!-- Player & Details Modal -->
  <div id="player-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div class="player-container">
        <iframe id="video-player" allowfullscreen></iframe>
      </div>
      <div class="modal-body">
        <h2 id="modal-title">Movie Title</h2>
        
        <!-- Multi-Server Selector -->
        <div class="server-picker">
          <button class="server-btn active" data-server="videasy" onclick="switchServer('videasy')">Server 1 (Primary)</button>
          <button class="server-btn" data-server="vidsrccc" onclick="switchServer('vidsrccc')">Server 2 (Vidsrc.cc)</button>
          <button class="server-btn" data-server="vidsrcpro" onclick="switchServer('vidsrcpro')">Server 3 (Fast)</button>
        </div>

        <div class="movie-details">
          <h3>Overview</h3>
          <p id="modal-overview">Movie overview text goes here...</p>
        </div>

        <!-- Recommendations Grid -->
        <h3 style="margin-top: 24px;" class="section-title">You Might Also Like</h3>
        <div id="recommendations-grid" class="grid"></div>
      </div>
    </div>
  </div>

  <!-- JavaScript App Logic -->
  <script>
    const APP_CONFIG = Object.freeze({
      API_KEY: 'c5f2e226dd2ee0c8ed2c272a0ebaf049',
      BASE_URL: 'https://api.themoviedb.org/3',
      POSTER_URL: 'https://image.tmdb.org/t/p/w342',
      SERVERS: {
        videasy: 'https://player.videasy.net/movie/',
        vidsrccc: 'https://vidsrc.cc/v2/embed/movie/',
        vidsrcpro: 'https://vidsrc.pro/embed/movie/'
      }
    });

    const appState = {
      activeMovie: null,
      activeServer: 'videasy',
      watchlist: JSON.parse(localStorage.getItem('sv_watchlist') || '[]'),
      searchTimeout: null
    };

    /* --- API Engine --- */
    async function apiFetch(endpoint, params = {}) {
      try {
        const url = new URL(`${APP_CONFIG.BASE_URL}${endpoint}`);
        url.searchParams.set('api_key', APP_CONFIG.API_KEY);
        Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
        
        const res = await fetch(url.toString());
        return res.ok ? await res.json() : null;
      } catch (err) {
        console.error('API Error:', err);
        return null;
      }
    }

    async function fetchCleanMovies() {
      const data = await apiFetch('/discover/movie', {
        sort_by: 'popularity.desc',
        without_genres: '10764,10767,10763,99,16', // Excludes Reality, Talk, News, Docs, Anime
        page: 1
      });
      return data?.results || [];
    }

    /* --- UI Rendering --- */
    function renderSkeletons(container, count = 6) {
      container.innerHTML = Array(count).fill('<div class="skeleton-card"></div>').join('');
    }

    function createMovieCard(movie) {
      const isSaved = appState.watchlist.some(item => item.id === movie.id);
      const card = document.createElement('div');
      card.className = 'movie-card';
      
      card.innerHTML = `
        <img src="${movie.poster_path ? APP_CONFIG.POSTER_URL + movie.poster_path : 'https://via.placeholder.com/342x513'}" 
             alt="${movie.title}" loading="lazy">
        <button class="bookmark-btn" data-id="${movie.id}" style="color:${isSaved ? '#e50914' : '#fff'};">
          ${isSaved ? '♥' : '♡'}
        </button>
        <div class="movie-info">
          <h4>${movie.title}</h4>
          <span>★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}</span>
        </div>
      `;

      card.addEventListener('click', (e) => {
        if (e.target.classList.contains('bookmark-btn')) {
          e.stopPropagation();
          toggleWatchlist(movie, e.target);
          return;
        }
        openPlaybackModal(movie);
      });

      return card;
    }

    /* --- Modal & Video Playback --- */
    async function openPlaybackModal(movie) {
      appState.activeMovie = movie;
      
      document.getElementById('modal-title').textContent = movie.title;
      document.getElementById('modal-overview').textContent = movie.overview || 'No description available.';
      
      switchServer(appState.activeServer);
      document.getElementById('player-modal').style.display = 'flex';
      
      loadRecommendations(movie.id);
    }

    function closeModal() {
      document.getElementById('player-modal').style.display = 'none';
      document.getElementById('video-player').src = '';
    }

    function switchServer(serverKey) {
      appState.activeServer = serverKey;
      const iframe = document.getElementById('video-player');
      if (!iframe || !appState.activeMovie) return;

      iframe.src = `${APP_CONFIG.SERVERS[serverKey]}${appState.activeMovie.id}`;
      
      document.querySelectorAll('.server-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.server === serverKey);
      });
    }

    async function loadRecommendations(movieId) {
      const container = document.getElementById('recommendations-grid');
      renderSkeletons(container, 4);
      
      const data = await apiFetch(`/movie/${movieId}/recommendations`);
      container.innerHTML = '';

      if (data?.results?.length) {
        data.results.slice(0, 6).forEach(movie => {
          container.appendChild(createMovieCard(movie));
        });
      } else {
        container.innerHTML = '<p style="color:var(--text-muted);">No similar movies found.</p>';
      }
    }

    /* --- LocalStorage Watchlist --- */
    function toggleWatchlist(movie, buttonEl) {
      const index = appState.watchlist.findIndex(item => item.id === movie.id);
      
      if (index > -1) {
        appState.watchlist.splice(index, 1);
        if (buttonEl) { buttonEl.innerHTML = '♡'; buttonEl.style.color = '#fff'; }
      } else {
        appState.watchlist.push(movie);
        if (buttonEl) { buttonEl.innerHTML = '♥'; buttonEl.style.color = '#e50914'; }
      }

      localStorage.setItem('sv_watchlist', JSON.stringify(appState.watchlist));
      renderWatchlistSection();
    }

    function renderWatchlistSection() {
      const container = document.getElementById('watchlist-grid');
      const section = document.getElementById('watchlist-section');

      container.innerHTML = '';
      if (appState.watchlist.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      appState.watchlist.forEach(movie => {
        container.appendChild(createMovieCard(movie));
      });
    }

    /* --- Live Search --- */
    function initLiveSearch() {
      const searchInput = document.getElementById('search-input');
      const searchResults = document.getElementById('search-results-grid');
      const searchSection = document.getElementById('search-section');

      searchInput.addEventListener('input', (e) => {
        clearTimeout(appState.searchTimeout);
        const query = e.target.value.trim();

        if (!query) {
          searchSection.style.display = 'none';
          searchResults.innerHTML = '';
          return;
        }

        appState.searchTimeout = setTimeout(async () => {
          searchSection.style.display = 'block';
          renderSkeletons(searchResults, 6);
          
          const data = await apiFetch('/search/movie', { query });
          searchResults.innerHTML = '';

          if (data?.results?.length) {
            data.results.forEach(movie => {
              if (movie.poster_path) searchResults.appendChild(createMovieCard(movie));
            });
          } else {
            searchResults.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1;">No movies found.</p>';
          }
        }, 300);
      });
    }

    /* --- App Init --- */
    async function initApp() {
      initLiveSearch();
      renderWatchlistSection();

      const mainGrid = document.getElementById('main-movie-grid');
      renderSkeletons(mainGrid, 12);
      
      const movies = await fetchCleanMovies();
      mainGrid.innerHTML = '';
      movies.forEach(movie => mainGrid.appendChild(createMovieCard(movie)));
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
