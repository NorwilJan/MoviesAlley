<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelRoom - Stream Movies & TV Shows</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="Style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-left">
      <div class="logo" id="navLogo">Reel<span>Room</span></div>
      <nav class="nav-links">
        <a href="#" class="nav-item active" data-tab="all">Home</a>
        <a href="#" class="nav-item" data-tab="movie">Movies</a>
        <a href="#" class="nav-item" data-tab="tv">TV Shows</a>
      </nav>
    </div>
    <div class="nav-right">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search movies, TV shows..." autocomplete="off">
        <button id="clearSearch" class="clear-btn hidden">&times;</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="main-container">

    <!-- HERO BANNER -->
    <section class="hero-banner" id="heroBanner">
      <div class="hero-backdrop" id="heroBackdrop"></div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <span class="hero-badge" id="heroBadge">Featured</span>
        <h1 class="hero-title" id="heroTitle">Loading...</h1>
        <div class="hero-meta">
          <span class="meta-rating" id="heroRating"><i class="fa-solid fa-star"></i> --</span>
          <span class="meta-year" id="heroYear">----</span>
          <span class="meta-type" id="heroType">--</span>
        </div>
        <p class="hero-overview" id="heroOverview">Fetching featured content description...</p>
        <div class="hero-actions">
          <button class="btn btn-primary" id="heroPlayBtn">
            <i class="fa-solid fa-play"></i> Watch Now
          </button>
          <button class="btn btn-secondary" id="heroInfoBtn">
            <i class="fa-solid fa-circle-info"></i> More Info
          </button>
        </div>
      </div>
    </section>

    <!-- CONTENT SECTIONS (HOME TABS) -->
    <div id="tabContent" class="tab-content">
      <section class="content-row">
        <h2 class="row-title">Trending Now</h2>
        <div class="media-carousel" id="trendingRow"></div>
      </section>

      <section class="content-row">
        <h2 class="row-title">Popular Movies</h2>
        <div class="media-carousel" id="popularMoviesRow"></div>
      </section>

      <section class="content-row">
        <h2 class="row-title">Popular TV Shows</h2>
        <div class="media-carousel" id="popularTvRow"></div>
      </section>

      <section class="content-row">
        <h2 class="row-title">Top Rated</h2>
        <div class="media-carousel" id="topRatedRow"></div>
      </section>
    </div>

    <!-- GRID CATEGORY VIEW (MOVIES / TV SHOWS / SEARCH) -->
    <section id="categoryGridView" class="category-grid-view hidden">
      <div class="grid-header">
        <h2 id="gridTitle" class="grid-title">All Content</h2>
        <div class="grid-filters" id="gridFilters">
          <select id="genreSelect" class="genre-select">
            <option value="all">All Genres</option>
          </select>
        </div>
      </div>
      <div class="media-grid" id="mediaGrid"></div>
      <div class="grid-loader hidden" id="gridLoader">
        <div class="spinner"></div>
      </div>
    </section>

  </main>

  <!-- DETAILS & PLAYER MODAL -->
  <div class="modal-overlay hidden" id="detailsModal">
    <div class="modal-container">
      <button class="modal-close" id="modalClose">&times;</button>
      
      <!-- VIDEO PLAYER CONTAINER -->
      <div class="player-wrapper">
        <iframe id="modalVideo" src="" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>

      <!-- MODAL CONTROLS & DETAILS -->
      <div class="modal-body">
        
        <!-- SERVER SWITCHER -->
        <div class="server-switcher">
          <span>Server:</span>
          <button class="server-btn active" data-server="vidlink" onclick="switchServer('vidlink')">VidLink</button>
          <button class="server-btn" data-server="vidcore" onclick="switchServer('vidcore')">VidCore</button>
          <button class="server-btn" data-server="videasy" onclick="switchServer('videasy')">VideEasy</button>
        </div>

        <!-- TV SHOW SEASON/EPISODE SELECTOR -->
        <div class="tv-controls hidden" id="tvControls">
          <div class="control-group">
            <label for="seasonSelect">Season:</label>
            <select id="seasonSelect" class="custom-select"></select>
          </div>
          <div class="control-group">
            <label for="episodeSelect">Episode:</label>
            <select id="episodeSelect" class="custom-select"></select>
          </div>
        </div>

        <!-- METADATA -->
        <div class="modal-meta-header">
          <h2 id="modalTitle" class="modal-title">--</h2>
          <div class="hero-meta">
            <span class="meta-rating" id="modalRating"><i class="fa-solid fa-star"></i> --</span>
            <span class="meta-year" id="modalYear">----</span>
            <span class="meta-type" id="modalType">--</span>
          </div>
        </div>

        <p id="modalOverview" class="modal-overview">--</p>
      </div>
    </div>
  </div>

  <script src="Home.js"></script>
</body>
</html>
