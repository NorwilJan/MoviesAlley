<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Navigation -->
    <header class="navbar">
        <div class="logo">Stream<span>Vault</span></div>
        <div class="nav-actions">
            <button id="open-search-btn" class="icon-btn"><i class="fas fa-search"></i></button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="container">
        <section class="section">
            <h2 class="section-title">Trending Movies</h2>
            <div id="movie-grid" class="media-grid"></div>
        </section>
    </main>

    <!-- Search Modal -->
    <div id="search-modal" class="modal-backdrop hidden">
        <div class="modal-content search-modal-content">
            <div class="search-header">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Search movies or TV shows..." autocomplete="off">
                <button id="close-search-btn" class="close-btn">&times;</button>
            </div>

            <!-- Recent Searches Section -->
            <div id="recent-searches-container" class="recent-searches-container hidden">
                <div class="recent-header">
                    <span>Recent Searches</span>
                    <button id="clear-history-btn" class="text-btn">Clear All</button>
                </div>
                <div id="recent-tags-list" class="tags-list"></div>
            </div>

            <!-- Search Results Grid -->
            <div id="search-results-grid" class="media-grid"></div>
        </div>
    </div>

    <!-- Player / Details Modal -->
    <div id="player-modal" class="modal-backdrop hidden">
        <div class="modal-content player-modal-content">
            <button id="close-player-btn" class="close-btn">&times;</button>
            
            <div class="player-container">
                <iframe id="player-iframe" src="" allowfullscreen frameborder="0"></iframe>
            </div>

            <div class="player-controls">
                <h3 id="player-title">Loading...</h3>
                <div class="server-selection">
                    <span class="label">Servers:</span>
                    <div id="server-selector-container" class="server-buttons"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/home.js"></script>
</body>
</html>
