<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream - Watch Movies & TV Shows</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="Home.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="logo">STREAM</div>
    <div class="nav-actions">
      <button id="open-search-btn" class="icon-btn" aria-label="Search"><i class="fas fa-search"></i></button>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main id="main-content">
    <section class="results-grid" id="main-grid">
      <!-- Media Cards injected here -->
    </section>
  </main>

  <!-- Search Overlay Modal -->
  <div id="search-modal" class="modal" role="dialog" aria-hidden="true">
    <div class="modal-overlay"></div>
    <div class="modal-content search-content">
      <div class="search-header">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Search movies, TV shows..." autocomplete="off">
        <button id="close-search-btn" class="icon-btn"><i class="fas fa-times"></i></button>
      </div>
      <div id="search-results" class="search-results-grid"></div>
    </div>
  </div>

  <!-- Player / Media Details Modal -->
  <div id="player-modal" class="modal" role="dialog" aria-hidden="true">
    <div class="modal-overlay"></div>
    <div class="modal-content player-modal-content">
      <button id="close-player-btn" class="icon-btn close-modal"><i class="fas fa-times"></i></button>
      
      <!-- Video Player Wrapper -->
      <div id="player-container" class="player-wrapper">
        <iframe id="video-player" src="" frameborder="0" allowfullscreen></iframe>
        
        <!-- Player Quick Controls Bar -->
        <div id="player-quick-controls" class="player-quick-controls">
          <button id="skip-intro-btn" class="quick-btn">
            <i class="fas fa-step-forward"></i> Skip Intro (+85s)
          </button>
          <button id="next-ep-btn" class="quick-btn primary">
            <i class="fas fa-forward"></i> Next Episode
          </button>
        </div>
      </div>

      <!-- Media Details Info -->
      <div class="media-details">
        <h2 id="media-title">---</h2>
        <p id="media-overview">---</p>
      </div>
    </div>
  </div>

  <script src="Home.js"></script>
</body>
</html>
