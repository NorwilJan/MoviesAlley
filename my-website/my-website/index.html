<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelRoom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-left">
      <div class="brand-logo" onclick="switchTab('home')">ReelRoom</div>
      <nav class="nav-links">
        <button class="nav-btn active" id="tab-home" onclick="switchTab('home')">Home</button>
        <button class="nav-btn" id="tab-movies" onclick="switchTab('movies')">Movies</button>
        <button class="nav-btn" id="tab-tv" onclick="switchTab('tv')">TV Shows</button>
        <button class="nav-btn" id="tab-trending" onclick="switchTab('trending')">Trending</button>
      </nav>
    </div>
    <div class="nav-right">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search movies, TV shows..." oninput="handleSearchInput(event)">
        <button class="search-btn" onclick="executeSearch()">🔍</button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content" id="main-content">
    
    <!-- Hero / Featured Banner -->
    <section class="hero-section" id="hero-section">
      <div class="hero-backdrop" id="hero-backdrop"></div>
      <div class="hero-overlay"></div>
      <div class="hero-details">
        <h1 class="hero-title" id="hero-title">Loading...</h1>
        <p class="hero-overview" id="hero-overview"></p>
        <div class="hero-actions">
          <button class="btn btn-primary" id="hero-play-btn" onclick="openHeroMedia()">▶ Play Now</button>
          <button class="btn btn-secondary" id="hero-info-btn" onclick="openHeroDetails()">ℹ More Info</button>
        </div>
      </div>
    </section>

    <!-- Dynamic Media Rows Container -->
    <div class="rows-container" id="rows-container"></div>

  </main>

  <!-- Player & Details Modal -->
  <div class="modal-backdrop" id="media-modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-content">
      <button class="modal-close-btn" onclick="closeMediaModal()">✕</button>

      <!-- Player Frame Area -->
      <div class="player-container" id="player-container">
        <iframe id="video-iframe" src="" allowfullscreen frameborder="0"></iframe>
      </div>

      <!-- Media Details & Controls Area -->
      <div class="modal-details-container">
        <div class="modal-header">
          <h2 id="modal-title">Title</h2>
          <div class="modal-meta">
            <span id="modal-rating">⭐ -</span>
            <span id="modal-year">----</span>
            <span id="modal-type" class="badge">MOVIE</span>
          </div>
        </div>

        <p id="modal-overview" class="modal-overview"></p>

        <!-- TV Show Controls (Seasons & Episodes) -->
        <div class="series-controls" id="series-options" style="display: none;">
          <div class="season-selector-wrapper">
            <label for="season-select">Season:</label>
            <select id="season-select" onchange="onSeasonChange()"></select>
          </div>
          <div class="episodes-wrapper">
            <label>Episodes:</label>
            <div class="episodes-grid" id="episodes-container"></div>
          </div>
        </div>

        <!-- Server Selector -->
        <div class="server-selector-wrapper">
          <label for="server-select">Server:</label>
          <select id="server-select" onchange="onServerChange()">
            <option value="vidsrc.to">Server 1 (VidSrc.to)</option>
            <option value="vidsrc.me">Server 2 (VidSrc.me)</option>
            <option value="2embed">Server 3 (2Embed)</option>
            <option value="autoembed">Server 4 (AutoEmbed)</option>
          </select>
        </div>

      </div>
    </div>
  </div>

  <script src="Home.js"></script>
</body>
</html>
