<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelRoom - Stream Movies & TV Shows</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --text-color: #ffffff;
      --text-muted: #aaaaaa;
      --accent-color: #e50914;
      --nav-bg: rgba(13, 13, 13, 0.9);
      --modal-bg: #141414;
    }

    [data-theme="light"] {
      --bg-color: #f4f4f5;
      --card-bg: #ffffff;
      --text-color: #09090b;
      --text-muted: #71717a;
      --accent-color: #e50914;
      --nav-bg: rgba(244, 244, 245, 0.9);
      --modal-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-color);
      cursor: pointer;
    }

    .nav-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-color); color: #fff; }

    .hero-banner {
      position: relative;
      width: 100%;
      height: 60vh;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 40px;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg-color), transparent 80%);
    }
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 600px;
    }
    .hero-title { font-size: 36px; margin-bottom: 12px; font-weight: 700; }
    .hero-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }

    main { padding: 32px; flex: 1; }
    .section-title { font-size: 20px; margin-bottom: 16px; font-weight: 600; }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .card img { width: 100%; height: 260px; object-fit: cover; }
    .card-body { padding: 12px; }
    .card-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* Player Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }

    .modal-content {
      background: var(--modal-bg);
      width: 100%;
      max-width: 960px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }

    .player-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      gap: 8px;
      background: rgba(0,0,0,0.75);
      padding: 6px 12px;
      border-radius: 6px;
    }

    .server-select, .selector-dropdown {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }

    iframe { width: 100%; height: 100%; border: none; }

    .modal-body { padding: 20px; }
    .tv-controls { display: flex; gap: 12px; margin-bottom: 12px; }

    .close-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 20;
      background: rgba(0,0,0,0.75);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="loadTrending()">ReelRoom</div>
    <div class="nav-actions">
      <input type="text" id="searchInput" placeholder="Search titles..." class="btn" style="width: 200px;" />
      <button class="btn" onclick="toggleTheme()">Theme</button>
    </div>
  </header>

  <div id="hero" class="hero-banner">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="heroTitle">Loading...</h1>
      <p class="hero-desc" id="heroDesc"></p>
      <button class="btn" id="heroPlayBtn">Play Now</button>
    </div>
  </div>

  <main>
    <h2 class="section-title" id="gridTitle">Trending Movies & Series</h2>
    <div id="grid" class="grid-container"></div>
  </main>

  <!-- STREAMING PLAYER MODAL -->
  <div id="playerModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closePlayer()">&times;</button>
      
      <div class="player-wrapper">
        <div class="player-controls">
          <select id="serverSelect" class="server-select" onchange="changeServer()">
            <option value="vidcore">Server: Vidcore (Primary)</option>
            <option value="vidlink">Server: VidLink (Fallback)</option>
            <option value="videasy">Server: Videasy (Backup)</option>
          </select>
        </div>
        <iframe id="playerFrame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="origin"></iframe>
      </div>

      <div class="modal-body">
        <h2 id="modalTitle">Media Title</h2>
        <div id="tvSelectorGroup" class="tv-controls" style="display: none; margin-top: 10px;">
          <select id="seasonSelect" class="selector-dropdown" onchange="onSeasonChange()"></select>
          <select id="episodeSelect" class="selector-dropdown" onchange="updatePlayerUrl()"></select>
        </div>
        <p id="modalDesc" style="font-size: 13px; color: var(--text-muted); margin-top: 8px;"></p>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = '3fd2be6f0c70a2a598f084dd9fb0ec1b'; // Standard TMDB v3 API Key
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMG_URL = 'https://image.tmdb.org/t/p/w500';
    const HERO_IMG_URL = 'https://image.tmdb.org/t/p/original';

    let currentItem = null;
    let currentServer = 'vidcore';

    // Provider Routing Definitions
    const PROVIDERS = {
      vidcore: (id, type, s, e) => 
        type === 'tv'
          ? `https://vidcore.org/embed/tv/${id}/${s}/${e}?theme=e50914&autoplay=true`
          : `https://vidcore.org/embed/movie/${id}?theme=e50914&autoplay=true`,
      vidlink: (id, type, s, e) =>
        type === 'tv'
          ? `https://vidlink.pro/tv/${id}/${s}/${e}`
          : `https://vidlink.pro/movie/${id}`,
      videasy: (id, type, s, e) =>
        type === 'tv'
          ? `https://player.videasy.net/tv/${id}/${s}/${e}`
          : `https://player.videasy.net/movie/${id}`
    };

    async function loadTrending() {
      const res = await fetch(`${BASE_URL}/trending/all/week?api_key=${API_KEY}`);
      const data = await res.json();
      const items = data.results.filter(item => item.poster_path);
      
      setupHero(items[0]);
      renderGrid(items, 'Trending Movies & Series');
    }

    function setupHero(item) {
      document.getElementById('hero').style.backgroundImage = `url(${HERO_IMG_URL + item.backdrop_path})`;
      document.getElementById('heroTitle').innerText = item.title || item.name;
      document.getElementById('heroDesc').innerText = item.overview;
      document.getElementById('heroPlayBtn').onclick = () => openPlayer(item);
    }

    function renderGrid(items, title) {
      document.getElementById('gridTitle').innerText = title;
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      items.forEach(item => {
        const type = item.media_type || (item.title ? 'movie' : 'tv');
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${IMG_URL + item.poster_path}" alt="${item.title || item.name}" />
          <div class="card-body">
            <div class="card-title">${item.title || item.name}</div>
            <div class="card-meta">${type.toUpperCase()} • ${ (item.release_date || item.first_air_date || '').split('-')[0] }</div>
          </div>
        `;
        card.onclick = () => openPlayer({ ...item, media_type: type });
        grid.appendChild(card);
      });
    }

    async function openPlayer(item) {
      currentItem = item;
      const type = item.media_type || (item.title ? 'movie' : 'tv');
      
      document.getElementById('modalTitle').innerText = item.title || item.name;
      document.getElementById('modalDesc').innerText = item.overview;
      
      const tvControls = document.getElementById('tvSelectorGroup');

      if (type === 'tv') {
        tvControls.style.display = 'flex';
        await fetchTVSeasons(item.id);
      } else {
        tvControls.style.display = 'none';
        updatePlayerUrl();
      }

      document.getElementById('playerModal').classList.add('active');
    }

    async function fetchTVSeasons(tvId) {
      const res = await fetch(`${BASE_URL}/tv/${tvId}?api_key=${API_KEY}`);
      const data = await res.json();
      
      const seasonSelect = document.getElementById('seasonSelect');
      seasonSelect.innerHTML = '';
      
      data.seasons.filter(s => s.season_number > 0).forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.season_number;
        opt.innerText = `Season ${s.season_number}`;
        seasonSelect.appendChild(opt);
      });

      onSeasonChange();
    }

    function onSeasonChange() {
      const episodeSelect = document.getElementById('episodeSelect');
      episodeSelect.innerHTML = '';
      
      // Default fill 24 episodes for layout selection
      for (let i = 1; i <= 24; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `Episode ${i}`;
        episodeSelect.appendChild(opt);
      }
      
      updatePlayerUrl();
    }

    function updatePlayerUrl() {
      if (!currentItem) return;
      
      const type = currentItem.media_type || (currentItem.title ? 'movie' : 'tv');
      const season = document.getElementById('seasonSelect').value || 1;
      const episode = document.getElementById('episodeSelect').value || 1;

      const url = PROVIDERS[currentServer](currentItem.id, type, season, episode);
      document.getElementById('playerFrame').src = url;
    }

    function changeServer() {
      currentServer = document.getElementById('serverSelect').value;
      updatePlayerUrl();
    }

    function closePlayer() {
      document.getElementById('playerModal').classList.remove('active');
      document.getElementById('playerFrame').src = '';
    }

    document.getElementById('searchInput').addEventListener('keypress', async (e) => {
      if (e.key === 'Enter') {
        const query = e.target.value;
        if (!query) return;
        const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        renderGrid(data.results.filter(i => i.poster_path), `Search results for: "${query}"`);
      }
    });

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
    }

    // Initialize App
    loadTrending();
  </script>
</body>
</html>
