<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-left">
            <div class="logo">Stream<span>Vault</span></div>
            <nav class="nav-links">
                <button class="nav-btn active" data-type="all">Home</button>
                <button class="nav-btn" data-type="movie">Movies</button>
                <button class="nav-btn" data-type="tv">TV Series</button>
                <button class="nav-btn" data-type="watchlist">My List</button>
            </nav>
        </div>
        <div class="nav-right">
            <button id="open-search-btn" class="icon-btn" title="Search">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </header>

    <!-- Genre Filter Bar -->
    <section class="genre-bar-container">
        <div id="genre-bar" class="genre-bar">
            <button class="genre-chip active" data-genre="all">All Genres</button>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="container">
        <section class="section">
            <h2 id="section-title" class="section-title">Trending Now</h2>
            <div id="media-grid" class="media-grid"></div>
            
            <!-- Infinite Scroll Loader -->
            <div id="loading-spinner" class="spinner-container hidden">
                <div class="spinner"></div>
            </div>
        </section>
    </main>

    <!-- Search Modal -->
    <div id="search-modal" class="modal-backdrop hidden">
        <div class="modal-content search-modal-content">
            <div class="search-header">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Search movies, TV shows..." autocomplete="off">
                <button id="close-search-btn" class="close-btn">&times;</button>
            </div>

            <!-- Recent Search History -->
            <div id="recent-searches-container" class="recent-searches-container hidden">
                <div class="recent-header">
                    <span>Recent Searches</span>
                    <button id="clear-history-btn" class="text-btn">Clear All</button>
                </div>
                <div id="recent-tags-list" class="tags-list"></div>
            </div>

            <!-- Search Results -->
            <div id="search-results-grid" class="media-grid"></div>
        </div>
    </div>

    <!-- Video Player & Details Modal -->
    <div id="player-modal" class="modal-backdrop hidden">
        <div class="modal-content player-modal-content">
            <button id="close-player-btn" class="close-btn">&times;</button>
            
            <div class="player-container">
                <iframe id="player-iframe" src="" allowfullscreen frameborder="0" allow="autoplay; encrypted-media"></iframe>
            </div>

            <div class="player-details">
                <div class="details-header">
                    <div>
                        <h2 id="player-title">Title</h2>
                        <div class="media-meta">
                            <span id="player-rating"><i class="fas fa-star"></i> 0.0</span>
                            <span id="player-year">2026</span>
                            <span id="player-type" class="badge">MOVIE</span>
                        </div>
                    </div>
                    <button id="watchlist-toggle-btn" class="action-btn">
                        <i class="fas fa-plus"></i> Add to List
                    </button>
                </div>

                <p id="player-overview" class="overview-text">Overview description...</p>

                <!-- Server Selection Controls -->
                <div class="server-selection">
                    <span class="label"><i class="fas fa-server"></i> Switch Server:</span>
                    <div id="server-selector-container" class="server-buttons"></div>
                </div>

                <!-- TV Show Selector (Hidden for movies) -->
                <div id="tv-controls" class="tv-controls hidden">
                    <div class="selector-group">
                        <label for="season-select">Season:</label>
                        <select id="season-select"></select>
                    </div>
                    <div class="selector-group">
                        <label for="episode-select">Episode:</label>
                        <select id="episode-select"></select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/home.js"></script>
</body>
</html>
