<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelRoom Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .player-container {
      position: relative;
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .player-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.8);
      padding: 6px 12px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .server-select {
      background-color: #1a1a1a;
      color: #ffffff;
      border: 1px solid #333333;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .server-select:hover {
      border-color: #e50914;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #050505;
      color: #a0a0a0;
      font-size: 14px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #e50914;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <!-- Server Switcher Controls -->
    <div class="player-controls">
      <select id="serverSelect" class="server-select">
        <option value="vidcore">Server: Vidcore (Primary)</option>
        <option value="vidlink">Server: VidLink (Fallback)</option>
        <option value="videasy">Server: Videasy (Backup)</option>
      </select>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <span>Loading player stream...</span>
    </div>

    <!-- Media Stream Frame -->
    <iframe 
      id="streamFrame"
      allowfullscreen 
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      referrerpolicy="origin">
    </iframe>
  </div>

  <script>
    // Configuration Settings
    const CONFIG = {
      tmdbId: '533535',       // Replace with dynamic TMDB ID or URL search param
      type: 'movie',          // 'movie' or 'tv'
      season: 1,              // For TV shows
      episode: 1,             // For TV shows
      themeColor: 'e50914'    // Hex without '#'
    };

    // Provider Route Engine
    const PROVIDERS = {
      vidcore: (config) => 
        config.type === 'tv'
          ? `https://vidcore.org/embed/tv/${config.tmdbId}/${config.season}/${config.episode}?theme=${config.themeColor}&autoplay=true`
          : `https://vidcore.org/embed/movie/${config.tmdbId}?theme=${config.themeColor}&autoplay=true`,
      
      vidlink: (config) => 
        config.type === 'tv'
          ? `https://vidlink.pro/tv/${config.tmdbId}/${config.season}/${config.episode}`
          : `https://vidlink.pro/movie/${config.tmdbId}`,

      videasy: (config) => 
        config.type === 'tv'
          ? `https://player.videasy.net/tv/${config.tmdbId}/${config.season}/${config.episode}`
          : `https://player.videasy.net/movie/${config.tmdbId}`
    };

    const streamFrame = document.getElementById('streamFrame');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const serverSelect = document.getElementById('serverSelect');

    function loadStream(providerKey) {
      loadingOverlay.style.display = 'flex';
      loadingOverlay.style.opacity = '1';
      
      const targetUrl = PROVIDERS[providerKey](CONFIG);
      streamFrame.src = targetUrl;
    }

    streamFrame.addEventListener('load', () => {
      loadingOverlay.style.opacity = '0';
      setTimeout(() => {
        loadingOverlay.style.display = 'none';
      }, 300);
    });

    serverSelect.addEventListener('change', (e) => {
      loadStream(e.target.value);
    });

    // Listen to postMessage events from Vidcore
    window.addEventListener('message', (event) => {
      if (!event.origin.includes('vidcore.org')) return;
      
      if (event.data?.type === 'vidcore:play') {
        console.log('Playback started on Vidcore');
      }
    });

    // Initial Load
    loadStream('vidcore');
  </script>

</body>
</html>
