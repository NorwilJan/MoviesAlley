<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelRoom</title>
  <link rel="stylesheet" href="home.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="brand-logo" id="brand-home">Reel<span>Room</span></a>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search movies or TV shows..." />
        <button id="search-btn">Search</button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-container">

    <!-- Search Results / Catalog Grid (Hidden when viewing player) -->
    <section id="catalog-section" class="catalog-section">
      <h2 id="catalog-title" class="section-title">Trending Now</h2>
      <div id="media-grid" class="media-grid"></div>
    </section>

    <!-- Player View Section -->
    <section id="player-section" class="player-section hidden">
      <button id="back-btn" class="btn-back">← Back to Browse</button>

      <!-- Video Player Wrapper -->
      <div class="video-wrapper">
        <iframe 
          id="vidlink-player"
          src="" 
          allowfullscreen 
          scrolling="no"
          allow="autoplay; encrypted-media; picture-in-picture">
        </iframe>
      </div>

      <!-- Video Metadata & Controls -->
      <div class="controls-bar">
        <div class="media-details">
          <div class="badges">
            <span id="media-badge" class="badge">Movie</span>
            <span id="media-rating" class="badge badge-rating">★ 0.0</span>
          </div>
          <h1 id="media-title" class="media-title">Loading...</h1>
          <p id="media-overview" class="media-overview"></p>
        </div>

        <!-- TV Controls -->
        <div id="tv-controls" class="tv-controls hidden">
          <div class="select-group">
            <label for="season-select">Season</label>
            <select id="season-select"></select>
          </div>
          <div class="select-group">
            <label for="episode-select">Episode</label>
            <select id="episode-select"></select>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="home.js"></script>
</body>
</html>
