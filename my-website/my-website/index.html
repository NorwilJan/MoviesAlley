<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelRoom - Stream Movies & TV Shows</title>
  <link rel="stylesheet" href="home.css" />
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <div class="nav-left">
        <a href="#" class="brand-logo">REEL<span>ROOM</span></a>
        <nav class="nav-links">
          <a href="#" class="nav-item active" data-filter="all">Home</a>
          <a href="#" class="nav-item" data-filter="movie">Movies</a>
          <a href="#" class="nav-item" data-filter="tv">TV Shows</a>
          <a href="#" class="nav-item" id="nav-watchlist">My List</a>
        </nav>
      </div>
      <div class="nav-right">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-input" placeholder="Search movies, TV shows..." autocomplete="off" />
          <button id="search-clear-btn" class="hidden"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Wrapper -->
  <main>
    <!-- Featured Hero Section -->
    <section class="hero-banner" id="hero-banner">
      <div class="hero-backdrop" id="hero-backdrop"></div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <span class="hero-badge" id="hero-badge">FEATURED</span>
        <h1 class="hero-title" id="hero-title">Loading Featured Content...</h1>
        <p class="hero-overview" id="hero-overview"></p>
        <div class="hero-actions">
          <button class="btn btn-primary" id="hero-play-btn">
            <i class="fa-solid fa-play"></i> Watch Now
          </button>
          <button class="btn btn-secondary" id="hero-watchlist-btn">
            <i class="fa-solid fa-plus"></i> Add to List
          </button>
        </div>
      </div>
    </section>

    <!-- Search Results Row (Hidden by Default) -->
    <section class="content-section hidden" id="search-section">
      <h2 class="section-title">Search Results</h2>
      <div class="media-grid" id="search-grid"></div>
    </section>

    <!-- Default Home Content Sections -->
    <div id="home-sections">
      <section class="content-section">
        <h2 class="section-title">Trending Movies</h2>
        <div class="carousel-container">
          <button class="carousel-btn prev-btn"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="media-row" id="trending-movies"></div>
          <button class="carousel-btn next-btn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </section>

      <section class="content-section">
        <h2 class="section-title">Popular TV Series</h2>
        <div class="carousel-container">
          <button class="carousel-btn prev-btn"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="media-row" id="popular-tv"></div>
          <button class="carousel-btn next-btn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </section>

      <section class="content-section">
        <h2 class="section-title">Top Rated Movies</h2>
        <div class="carousel-container">
          <button class="carousel-btn prev-btn"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="media-row" id="top-rated-movies"></div>
          <button class="carousel-btn next-btn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </section>

      <section class="content-section hidden" id="watchlist-section">
        <h2 class="section-title">My Watchlist</h2>
        <div class="media-grid" id="watchlist-grid"></div>
      </section>
    </div>
  </main>

  <!-- Video Player Modal -->
  <div class="modal-overlay hidden" id="player-modal">
    <div class="modal-container">
      <button class="modal-close-btn" id="modal-close-btn"><i class="fa-solid fa-xmark"></i></button>
      
      <!-- Video Frame Container -->
      <div class="player-wrapper">
        <iframe id="vidlink-iframe" src="" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
      </div>

      <!-- Player Controls / Metadata -->
      <div class="modal-details">
        <div class="modal-header-info">
          <div>
            <h2 id="modal-media-title">Media Title</h2>
            <p id="modal-media-meta" class="meta-subtitle"></p>
          </div>

          <!-- Episode / Season Selector Controls for TV -->
          <div id="tv-controls" class="tv-controls hidden">
            <div class="select-group">
              <label for="season-select">Season</label>
              <select id="season-select"></select>
            </div>
            <div class="select-group">
              <label for="episode-select">Episode</label>
              <select id="episode-select"></select>
            </div>
          </div>
        </div>
        <p id="modal-media-overview" class="modal-overview"></p>
      </div>
    </div>
  </div>

  <script src="home.js"></script>
</body>
</html>
