<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelRoom - Stream Movies & TV Shows</title>
  <link rel="stylesheet" href="Home.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="#" class="logo">REELROOM</a>
    <div class="nav-controls">
      <button class="search-trigger-btn" id="searchTrigger" aria-label="Search media">
        🔍 <span>Search</span>
      </button>
    </div>
  </header>

  <!-- HERO BANNER -->
  <section class="banner" id="banner">
    <div class="banner-content">
      <h1 id="bannerTitle">Loading...</h1>
      <p id="bannerOverview"></p>
      <div class="banner-buttons">
        <button class="btn btn-primary" id="bannerPlay">▶ Play Now</button>
        <button class="btn btn-secondary" id="bannerInfo">ℹ More Info</button>
      </div>
    </div>
  </section>

  <!-- MAIN CAROUSELS -->
  <main class="main-container">

    <!-- CONTINUE WATCHING ROW -->
    <section class="row-section" id="continueWatchingRow" style="display: none;">
      <div class="row-header">
        <h2>Continue Watching</h2>
        <button class="clear-btn" id="clearContinueWatching">Clear History</button>
      </div>
      <div class="media-carousel" id="continueWatchingContainer"></div>
    </section>

    <!-- WATCHLIST ROW -->
    <section class="row-section" id="watchlistRow" style="display: none;">
      <div class="row-header">
        <h2>My Watchlist</h2>
        <button class="clear-btn" id="clearWatchlist">Clear All</button>
      </div>
      <div class="media-carousel" id="watchlistContainer"></div>
    </section>

    <!-- POPULAR MOVIES -->
    <section class="row-section">
      <div class="row-header">
        <h2>Popular Movies</h2>
        <button class="see-all-btn" data-grid-target="movie/popular" data-grid-title="Popular Movies" data-grid-type="movie">Explore All</button>
      </div>
      <div class="media-carousel" id="popularMoviesContainer"></div>
    </section>

    <!-- POPULAR TV SHOWS -->
    <section class="row-section">
      <div class="row-header">
        <h2>Trending TV Shows</h2>
        <button class="see-all-btn" data-grid-target="tv/popular" data-grid-title="Trending TV Shows" data-grid-type="tv">Explore All</button>
      </div>
      <div class="media-carousel" id="popularTvContainer"></div>
    </section>

    <!-- TOP RATED -->
    <section class="row-section">
      <div class="row-header">
        <h2>Top Rated Movies</h2>
        <button class="see-all-btn" data-grid-target="movie/top_rated" data-grid-title="Top Rated Movies" data-grid-type="movie">Explore All</button>
      </div>
      <div class="media-carousel" id="topRatedContainer"></div>
    </section>

  </main>

  <!-- DETAIL & PLAYER MODAL -->
  <div class="modal" id="modal" aria-hidden="true" role="dialog">
    <div class="modal-content">
      <button class="close-btn" id="closeModal" aria-label="Close modal">&times;</button>
      
      <div class="modal-backdrop-header" id="modalBackdrop"></div>
      
      <div class="modal-player-container">
        <iframe id="modalVideo" src="about:blank" allowfullscreen title="Media Player"></iframe>
      </div>

      <div class="modal-body">
        <h2 id="modalTitle">Title</h2>
        
        <div class="modal-meta-bar">
          <span id="modalRating">★ 0.0</span>
          <span id="modalDate">2024</span>
          <span id="modalGenres">Genres</span>
        </div>

        <div class="selectors-wrapper">
          <select id="serverSelector">
            <option value="vidlink">Server 1 (VidLink)</option>
            <option value="vidcore">Server 2 (VidCore)</option>
            <option value="videasy">Server 3 (VidEasy)</option>
          </select>

          <div id="seasonSelectorContainer" style="display: none;">
            <select id="seasonSelect"></select>
            <select id="episodeSelect"></select>
          </div>
        </div>

        <p id="modalOverview"></p>
        
        <button class="btn btn-secondary" id="addToWatchlist" style="margin-top: 15px;">+ Add to Watchlist</button>
      </div>
    </div>
  </div>

  <!-- SEARCH MODAL -->
  <div class="search-modal" id="searchModal" aria-hidden="true" role="dialog">
    <div class="search-modal-content">
      <button class="close-btn" id="closeSearch" aria-label="Close search">&times;</button>
      <h2>Search ReelRoom</h2>
      <input type="text" class="search-input-field" id="searchInput" placeholder="Search movies or TV shows..." />
      <div class="grid-layout" id="searchResults"></div>
    </div>
  </div>

  <!-- EXPLORE / GRID MODAL -->
  <div class="grid-modal" id="gridModal" aria-hidden="true" role="dialog">
    <div class="grid-modal-content">
      <button class="close-btn" id="closeGrid" aria-label="Close grid">&times;</button>
      <h2 id="gridTitle">Explore</h2>
      <div class="grid-layout" id="gridContainer"></div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast" id="toast">Notification message</div>

  <script src="Home.js"></script>
</body>
</html>
